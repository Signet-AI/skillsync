[package]
name = "skillsync"
version = "0.1.0"
edition = "2021"

[features]
default = []
test-hooks = []

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"
walkdir = "2"
thiserror = "1"
tempfile = "3"
libc = "0.2"
fs2 = "0.4"
ctrlc = "3"
ratatui = "0.29.0"
crossterm = "0.28.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
